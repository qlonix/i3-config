# ==========================================
# i3status モダンスタイル設定ファイル (コンパクト)
# ==========================================

general {
        colors = true
        color_good = "#50FA7B"      # 正常時 (エメラルドグリーン)
        color_degraded = "#F1FA8C"  # 注意時 (パステルイエロー)
        color_bad = "#FF5555"       # 警告時 (コーラルレッド)
        interval = 2
}

order += "volume master"
order += "disk /"
order += "wireless _first_"
order += "ethernet _first_"
order += "cpu_usage"
order += "memory"
order += "battery all"
order += "tztime local"

volume master {
        format = "🔊 %volume"
        format_muted = "🔇"
        device = "default"
        mixer = "Master"
        mixer_idx = 0
}

disk "/" {
        format = "💾 %avail"
}

wireless _first_ {
        format_up = "📡 %ip (%essid %quality)"
        format_down = ""
}

ethernet _first_ {
        format_up = "🌐 %ip"
        format_down = ""
}

cpu_usage {
        format = "⚡ %usage"
}

memory {
        format = "🧠 %used"
        threshold_degraded = "10%"
        format_degraded = "🧠 警告: %free"
}

battery all {
        format = "🔋[%status] %percentage (%remaining)"
        format_down = ""
        status_chr = "AC"
        status_bat = "BAT"
        status_unk = "?"
        status_full = "FULL"
        path = "/sys/class/power_supply/BAT%d/uevent"
        low_threshold = 15
}

tztime local {
        format = "📅 %m/%d 🕒 %H:%M"
}
